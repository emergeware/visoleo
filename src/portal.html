<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex,nofollow,noarchive"/>
<meta name="referrer" content="no-referrer"/>
<!--
  A CSP é herdada pelos documentos abertos no iframe (srcdoc herda a política
  do pai), por isso ela lista exactamente o que esses documentos precisam e
  nada mais. Não há 'script-src' externo: o único JavaScript de terceiros que
  os documentos usavam foi embutido no próprio ficheiro antes de ser cifrado.
-->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'none';
  script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' blob:;
  style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
  font-src 'self' data: https://fonts.gstatic.com;
  img-src 'self' data: blob:;
  media-src 'self' data: blob:;
  connect-src 'self';
  frame-src 'self' blob: data:;
  worker-src blob:;
  base-uri 'none';
  form-action 'none';
"/>
<!--
  O título e o resto desta página são deliberadamente neutros: quem só
  encontrou a URL não deve ficar a saber o que está atrás da senha. Tudo o que
  nomeia o conteúdo vive no catálogo cifrado.
-->
<title>Acesso restrito</title>
<style>
:root{
  --bg:#080B0E; --pan:#11161D; --pan2:#171D26; --ln:#242D37; --ln2:#303B47;
  --ink:#EAE6DB; --muted:#8B95A1; --dim:#5B6673;
  --accent:#E5A63C; --bad:#E4572E; --ok:#4FB477;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans);
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}

/* ---------- portão ---------- */
#gate{
  height:100%; display:flex; align-items:center; justify-content:center; padding:24px;
}
.card{
  width:100%; max-width:420px; background:var(--pan); border:1px solid var(--ln);
  border-radius:14px; padding:32px 28px 26px;
}
.lock{
  width:38px;height:38px;margin-bottom:20px;color:var(--accent);
}
h1{margin:0 0 8px; font-size:19px; font-weight:650; letter-spacing:-.01em}
.sub{margin:0 0 24px; font-size:13.5px; line-height:1.55; color:var(--muted)}
label{display:block;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);margin-bottom:8px}
.field{position:relative}
input[type=password],input[type=text]{
  width:100%; padding:12px 44px 12px 14px; background:var(--bg); color:var(--ink);
  border:1px solid var(--ln2); border-radius:9px; font-family:var(--mono);
  font-size:14px; letter-spacing:.02em; outline:none;
}
input:focus{border-color:var(--accent)}
input:disabled{opacity:.55}
.peek{
  position:absolute; right:6px; top:50%; transform:translateY(-50%);
  background:none;border:0;padding:8px;color:var(--dim);line-height:0;border-radius:6px;
}
.peek:hover{color:var(--ink)}
#go{
  width:100%; margin-top:14px; padding:12px; border:0; border-radius:9px;
  background:var(--accent); color:#1A1206; font-weight:650; font-size:14px;
}
#go:disabled{opacity:.5;cursor:default}
#msg{margin-top:14px;font-size:13px;line-height:1.5;min-height:19px}
#msg.err{color:var(--bad)}
#msg.work{color:var(--muted)}
.bar{height:2px;background:var(--ln);border-radius:2px;overflow:hidden;margin-top:14px}
.bar i{display:block;height:100%;width:34%;background:var(--accent);border-radius:2px;
  animation:slide 1.1s cubic-bezier(.6,0,.4,1) infinite}
@keyframes slide{0%{transform:translateX(-110%)}100%{transform:translateX(330%)}}
.foot{
  margin-top:24px;padding-top:16px;border-top:1px solid var(--ln);
  font-family:var(--mono);font-size:10.5px;line-height:1.7;color:var(--dim);
}

/* ---------- hub ---------- */
#hub{height:100%;display:flex;flex-direction:column}
.top{
  display:flex;align-items:center;gap:14px;padding:16px 22px;
  border-bottom:1px solid var(--ln);background:var(--pan);flex:0 0 auto;
}
.top h2{margin:0;font-size:14px;font-weight:600;letter-spacing:-.005em;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ghost{
  background:none;border:1px solid var(--ln2);border-radius:8px;padding:7px 13px;
  font-size:12.5px;color:var(--muted);white-space:nowrap;
}
.ghost:hover{color:var(--ink);border-color:var(--dim)}
.list{flex:1;overflow-y:auto;padding:28px 22px 40px}
.inner{max-width:660px;margin:0 auto}
.doc{
  display:flex;align-items:center;gap:16px;width:100%;text-align:left;
  background:var(--pan);border:1px solid var(--ln);border-radius:12px;
  padding:18px 20px;margin-bottom:12px;transition:border-color .13s,background .13s;
}
.doc:hover{border-color:var(--ln2);background:var(--pan2)}
.doc:disabled{opacity:.6;cursor:default}
.doc .n{
  flex:0 0 auto;width:30px;height:30px;border-radius:8px;background:var(--pan2);
  border:1px solid var(--ln2);display:grid;place-items:center;
  font-family:var(--mono);font-size:12px;color:var(--accent);
}
.doc .txt{flex:1;min-width:0}
.doc .lab{display:block;font-size:15px;font-weight:600;letter-spacing:-.005em}
.doc .note{display:block;font-size:12.5px;color:var(--muted);margin-top:3px}
.doc .arrow{flex:0 0 auto;color:var(--dim)}
.doc:hover .arrow{color:var(--accent)}
.hint{font-family:var(--mono);font-size:10.5px;color:var(--dim);line-height:1.8;
  margin-top:26px;padding-top:18px;border-top:1px solid var(--ln)}

/* ---------- visualizador ---------- */
#view{height:100%;display:flex;flex-direction:column;background:var(--bg)}
.stage{position:relative;flex:1;min-height:0}
/* Fundo escuro, não branco: estes documentos demoram a pintar da primeira vez
   — 300 KB de HTML e 100 KB de JavaScript a interpretar, com as fontes ainda
   por chegar — e um iframe branco por baixo dá um clarão no meio do escuro. */
#frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
#loading{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:14px;background:var(--bg);color:var(--muted);font-size:13px;
}
#loading .bar{width:180px;margin:0}
</style>
</head>
<body>

<!-- ====================== portão ====================== -->
<main id="gate">
  <form class="card" id="form" autocomplete="off">
    <svg class="lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="4" y="10.5" width="16" height="10.5" rx="2.2"/>
      <path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/>
    </svg>
    <h1>Acesso restrito</h1>
    <p class="sub">Este material é confidencial. Informe a chave de acesso que lhe foi entregue.</p>

    <label for="pw">Chave de acesso</label>
    <div class="field">
      <input id="pw" type="password" autocomplete="off" autocapitalize="off"
             autocorrect="off" spellcheck="false" required/>
      <button class="peek" id="peek" type="button" title="Mostrar" aria-label="Mostrar a chave">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z"/>
          <circle cx="12" cy="12" r="2.6"/>
        </svg>
      </button>
    </div>
    <button id="go" type="submit">Entrar</button>
    <div class="bar" id="bar" hidden><i></i></div>
    <div id="msg" role="status" aria-live="polite"></div>

    <p class="foot">
      AES-256-GCM · Argon2id 64 MiB<br/>
      A chave é derivada neste dispositivo e nunca é enviada.
    </p>
  </form>
</main>

<!-- ====================== hub ====================== -->
<div id="hub" hidden>
  <div class="top">
    <h2 id="hubTitle">Documentos</h2>
    <button class="ghost" id="lock" type="button">Terminar sessão</button>
  </div>
  <div class="list">
    <div class="inner" id="docs"></div>
  </div>
</div>

<!-- ====================== visualizador ====================== -->
<div id="view" hidden>
  <div class="top">
    <button class="ghost" id="back" type="button">&#8592; Documentos</button>
    <h2 id="viewTitle"></h2>
  </div>
  <div class="stage">
    <iframe id="frame"
            sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation"
            referrerpolicy="no-referrer"></iframe>
    <div id="loading" role="status" aria-live="polite">
      <div class="bar"><i></i></div>
      <span>A abrir o documento…</span>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';

// O bundle Argon2id (hash-wasm, MIT) entra aqui em base64 no momento do build.
// Base64 e não texto solto porque assim nada no bundle — uma marca de fecho de
// script dentro de uma string, por exemplo — consegue partir esta página. O
// build recusa gerar o portal se essa marca aparecer aqui dentro, comentários
// incluídos: o parser de HTML não distingue comentário de código.
const ARGON2_B64 = "__ARGON2_B64__";

const $ = (id) => document.getElementById(id);
const enc = new TextEncoder();
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

const gate = $('gate'); const hub = $('hub'); const view = $('view');
const pw = $('pw'); const go = $('go'); const msg = $('msg'); const bar = $('bar');

/** Chave mestra, só em memória e só enquanto esta página estiver aberta. Não
 *  vai para localStorage nem sessionStorage: recarregar a página volta a pedir
 *  a chave, e é isso que se quer. Importada como não-extraível, portanto nem o
 *  próprio código a consegue ler de volta. */
let master = null;
let manifest = null;
const cache = new Map();

const show = (el) => { for (const p of [gate, hub, view]) p.hidden = (p !== el); };

function say(text, kind) {
  msg.textContent = text || '';
  msg.className = kind || '';
}

/** Só o estado dos controlos. A mensagem é responsabilidade de quem chama —
 *  juntar as duas coisas fazia esta função apagar o erro que o catch tinha
 *  acabado de escrever. */
function busy(on) {
  go.disabled = on; pw.disabled = on; bar.hidden = !on;
}

/** Erro do qual não se recupera: o portão fica fechado e a razão à vista. */
function fatal(text) {
  busy(true);
  bar.hidden = true;
  say(text, 'err');
}

// --- Argon2id num worker -------------------------------------------------

// A derivação bloqueia a thread durante cerca de um segundo. No worker, o
// portão continua a responder e a barra de progresso continua a andar.
const WORKER_GLUE = `
self.onmessage = async (e) => {
  try {
    const k = await self.hashwasm.argon2id({
      password: e.data.password, salt: e.data.salt,
      memorySize: e.data.m, iterations: e.data.t,
      parallelism: e.data.p, hashLength: e.data.len,
      outputType: 'binary',
    });
    self.postMessage({ ok: true, key: k }, [k.buffer]);
  } catch (err) {
    self.postMessage({ ok: false, error: String(err && err.message || err) });
  }
};`;

function argon2(password, salt, kdf) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(new Blob([b64(ARGON2_B64), WORKER_GLUE], { type: 'text/javascript' }));
    const w = new Worker(url);
    const done = (fn) => (v) => { w.terminate(); URL.revokeObjectURL(url); fn(v); };
    const ok = done(resolve); const fail = done(reject);
    w.onmessage = (e) => (e.data.ok ? ok(e.data.key) : fail(new Error(e.data.error)));
    w.onerror = (e) => fail(new Error(e.message || 'falha no worker de derivação'));
    w.postMessage({ password, salt, m: kdf.m, t: kdf.t, p: kdf.p, len: kdf.len });
  });
}

// --- Primitivas ----------------------------------------------------------

/** HKDF-SHA256 — a mesma derivação que o build faz do lado do Node. */
async function subKey(salt, info) {
  const bits = await crypto.subtle.deriveBits(
    { name: 'HKDF', hash: 'SHA-256', salt, info: enc.encode(info) }, master, 256,
  );
  return crypto.subtle.importKey('raw', bits, { name: 'AES-GCM' }, false, ['decrypt']);
}

/** Abre um blob IV|ciphertext|tag. Uma chave errada rebenta aqui, na
 *  verificação da tag — não existe nenhum outro sítio onde a senha seja
 *  conferida, e portanto nada mais barato de atacar. */
async function open(key, aad, blob) {
  const plain = await crypto.subtle.decrypt(
    { name: 'AES-GCM', iv: blob.subarray(0, 12), additionalData: enc.encode(aad), tagLength: 128 },
    key, blob.subarray(12),
  );
  const ds = new DecompressionStream('gzip');
  return new Response(new Blob([plain]).stream().pipeThrough(ds)).arrayBuffer();
}

async function fetchBlob(name) {
  const r = await fetch(`vault/${name}`, { cache: 'no-store' });
  if (!r.ok) throw new Error(`vault/${name}: HTTP ${r.status}`);
  return new Uint8Array(await r.arrayBuffer());
}

// --- Fluxo ---------------------------------------------------------------

async function unlock(password) {
  const salt = b64(manifest.kdf.salt);
  const raw = await argon2(password, salt, manifest.kdf);
  master = await crypto.subtle.importKey('raw', raw, 'HKDF', false, ['deriveBits']);
  raw.fill(0);

  const key = await subKey(salt, 'visoleo/v1/catalog');
  const catalog = JSON.parse(new TextDecoder().decode(
    await open(key, manifest.catalog, await fetchBlob(manifest.catalog)),
  ));
  renderHub(catalog, salt);
}

function renderHub(catalog, salt) {
  const list = $('docs');
  list.textContent = '';
  catalog.forEach((doc, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'doc';
    b.innerHTML = `<span class="n">${i + 1}</span><span class="txt">`
      + `<span class="lab"></span><span class="note"></span></span>`
      + `<svg class="arrow" width="17" height="17" viewBox="0 0 24 24" fill="none" `
      + `stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">`
      + `<path d="M9 6l6 6-6 6"/></svg>`;
    b.querySelector('.lab').textContent = doc.label;
    b.querySelector('.note').textContent = doc.note;
    b.addEventListener('click', () => openDoc(doc, salt, b));
    list.appendChild(b);
  });

  const hint = document.createElement('p');
  hint.className = 'hint';
  hint.textContent = 'Sessão só em memória. Ao recarregar ou fechar o separador, '
    + 'a chave desaparece e volta a ser pedida.';
  list.appendChild(hint);

  show(hub);
}

/** Espera que o iframe tenha altura real, no máximo alguns fotogramas. Não é
 *  uma pausa a torcer para chegar: é a condição concreta que precisa de estar
 *  satisfeita, verificada a cada fotograma. */
async function frameLaidOut() {
  const f = $('frame');
  for (let i = 0; i < 20 && f.clientHeight === 0; i += 1) {
    await new Promise(requestAnimationFrame);
  }
}

async function openDoc(doc, salt, btn) {
  const note = btn.querySelector('.note');
  btn.disabled = true;
  note.textContent = 'a decifrar…';

  try {
    if (!cache.has(doc.id)) {
      const key = await subKey(salt, `visoleo/v1/doc/${doc.id}`);
      cache.set(doc.id, new TextDecoder().decode(await open(key, doc.file, await fetchBlob(doc.file))));
    }
  } catch (e) {
    note.textContent = `não foi possível abrir: ${e.message}`;
    btn.disabled = false;
    return;
  }
  note.textContent = doc.note;
  btn.disabled = false;

  $('viewTitle').textContent = btn.querySelector('.lab').textContent;
  $('loading').hidden = false;
  show(view);

  // O srcdoc só depois de o iframe estar visível e medido. Estes documentos
  // calculam o layout a partir do viewport quando arrancam, e um iframe ainda
  // escondido mede 0x0: o documento carrega, monta-se à volta de um ecrã de
  // tamanho nulo, e não pinta nada.
  await frameLaidOut();
  $('frame').srcdoc = cache.get(doc.id);
}

// --- Ligações ------------------------------------------------------------

$('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const password = pw.value;
  if (!password) return;
  busy(true);
  say('A derivar a chave — isto demora um segundo, de propósito.', 'work');

  let failure = null;
  try {
    await unlock(password);
    pw.value = '';
  } catch (err) {
    // A falha da tag GCM e um vault em falta chegam aqui pelo mesmo caminho,
    // por isso distinguem-se pela mensagem em vez de se assumir a senha.
    const detail = String((err && err.message) || err);
    failure = /HTTP|fetch|Network/i.test(detail)
      ? `Não foi possível ler o conteúdo cifrado (${detail}).`
      : 'Chave incorrecta.';
  }

  // Depois do catch, não dentro dele: o campo ainda está desactivado aqui e
  // pw.select() num campo desactivado não faz nada.
  busy(false);
  say(failure, failure ? 'err' : '');
  if (failure) pw.select();
});

$('peek').addEventListener('click', () => {
  const on = pw.type === 'password';
  pw.type = on ? 'text' : 'password';
  $('peek').title = on ? 'Ocultar' : 'Mostrar';
  pw.focus();
});

// O documento só tapa o indicador quando termina de carregar de facto. Limpar
// o srcdoc também dispara 'load', daí a condição.
$('frame').addEventListener('load', () => {
  if ($('frame').srcdoc) $('loading').hidden = true;
});

$('back').addEventListener('click', () => {
  $('frame').srcdoc = '';
  $('loading').hidden = false;
  show(hub);
});

$('lock').addEventListener('click', () => {
  master = null;
  cache.clear();
  $('frame').srcdoc = '';
  $('loading').hidden = false;
  pw.value = '';
  say('');
  show(gate);
  pw.focus();
});

// --- Arranque ------------------------------------------------------------

(async () => {
  if (!window.isSecureContext || !crypto.subtle) {
    fatal('Este portal precisa de uma ligação segura (HTTPS). Abra-o pelo endereço publicado.');
    return;
  }
  if (typeof DecompressionStream === 'undefined') {
    fatal('Este navegador é antigo demais para abrir o conteúdo. Use uma versão recente do Chrome, Edge, Firefox ou Safari.');
    return;
  }
  try {
    const r = await fetch('vault/manifest.json', { cache: 'no-store' });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    manifest = await r.json();
    pw.focus();
  } catch (e) {
    fatal(`Não foi possível carregar o conteúdo cifrado (${e.message}).`);
  }
})();
})();
</script>
</body>
</html>
